[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "solarseg"
version = "0.1.0"
description = "Solar Filament Segmentation Challenge 2026 Pipeline"
authors = [{ name = "Team Antigravity" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "segmentation-models-pytorch>=0.3.3",
    "pycocotools>=2.0.6",
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "pandas>=1.5.0",
    "opencv-python-headless>=4.7.0",
    "albumentations>=1.3.0",
    "scikit-image>=0.20.0",
    "matplotlib>=3.6.0",
    "tqdm>=4.64.0",
    "pytest>=7.2.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["solarseg*"]
